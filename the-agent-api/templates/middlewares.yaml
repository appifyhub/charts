{{- if and .Values.ingress.enabled .Values.ingress.rateLimit.enabled .Values.ingress.rateLimit.routes }}
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: {{ .Release.Name }}-rate-limit

spec:
  rateLimit:
    average: {{ .Values.ingress.rateLimit.average }}
    period: {{ .Values.ingress.rateLimit.period | quote }}
    burst: {{ .Values.ingress.rateLimit.burst }}
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: {{ .Values.ingress.rateLimit.ipv6Subnet }}
{{- range $index, $route := .Values.ingress.rateLimit.routes }}
{{- if hasKey $route "average" }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $.Release.Name }}-rate-limit-{{ $index }}
spec:
  rateLimit:
    average: {{ $route.average }}
    period: {{ $.Values.ingress.rateLimit.period | quote }}
    burst: {{ $.Values.ingress.rateLimit.burst }}
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: {{ $.Values.ingress.rateLimit.ipv6Subnet }}
{{- end }}
{{- end }}
{{- end }}
