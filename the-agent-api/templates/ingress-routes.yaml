{{- if and .Values.ingress.enabled .Values.ingress.rateLimit.enabled .Values.ingress.rateLimit.routes }}
{{- $host := printf "%s.%s" .Values.ingress.domain.prefix .Values.ingress.domain.base }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: {{ .Release.Name }}-rate-limited-ingress-route

spec:
  entryPoints:
    {{- range splitList "," (index .Values.ingress.annotations "traefik.ingress.kubernetes.io/router.entrypoints" | default "web") }}
    - {{ trim . }}
    {{- end }}
  routes:
    {{- range .Values.ingress.rateLimit.routes }}
    {{- if not (or .path .pathRegexp) }}
    {{- fail "each ingress.rateLimit.routes entry needs a path or a pathRegexp" }}
    {{- end }}
    - kind: Rule
      match: 'Host(`{{ $host }}`){{ with .method }} && Method(`{{ . }}`){{ end }} && {{ if .pathRegexp }}PathRegexp(`{{ .pathRegexp }}`){{ else }}Path(`{{ .path }}`){{ end }}'
      priority: 1000
      middlewares:
        - name: {{ $.Release.Name }}-rate-limit
      services:
        - name: {{ $.Release.Name }}-service
          port: {{ $.Values.app.servicePort }}
    {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- with index .Values.ingress.annotations "traefik.ingress.kubernetes.io/router.tls.certresolver" }}
    certResolver: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
