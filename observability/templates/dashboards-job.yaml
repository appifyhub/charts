{{- if .Values.dashboards.enabled }}
apiVersion: batch/v1
kind: Job

metadata:
  name: {{ .Release.Name }}-dashboards
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "10"

spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-dashboards
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: importer
          image: {{ .Values.dashboards.image.repository }}:{{ .Values.dashboards.image.tag }}
          imagePullPolicy: {{ .Values.dashboards.image.pullPolicy }}
          command:
            - python
            - -c
          args:
            - |
              import base64
              import json
              import os
              import time
              from pathlib import Path
              from urllib.error import HTTPError, URLError
              from urllib.parse import quote
              from urllib.request import Request, urlopen

              base_url = "http://openobserve:5080"
              organization = os.environ["ZO_ORGANIZATION"]
              folder = os.environ["ZO_DASHBOARD_FOLDER"]
              credentials = base64.b64encode(
                  f"{os.environ['ZO_ROOT_USER_EMAIL']}:{os.environ['ZO_ROOT_USER_PASSWORD']}".encode(),
              ).decode()

              def send(method, path, payload = None):
                  headers = {
                      "Authorization": f"Basic {credentials}",
                  }
                  data = None
                  if payload is not None:
                      headers["Content-Type"] = "application/json"
                      data = json.dumps(payload).encode()
                  request = Request(f"{base_url}{path}", data = data, headers = headers, method = method)
                  try:
                      with urlopen(request, timeout = 10) as response:
                          body = response.read()
                  except HTTPError as error:
                      raise SystemExit(f"{method} {path} failed: {error.code} {error.read().decode()}") from error
                  return json.loads(body) if body else None

              for _ in range(120):
                  try:
                      with urlopen(f"{base_url}/healthz", timeout = 3):
                          break
                  except (HTTPError, URLError, TimeoutError):
                      time.sleep(5)
              else:
                  raise SystemExit("OpenObserve did not become ready")

              listed = send("GET", f"/api/{quote(organization)}/dashboards?folder={quote(folder)}")
              existing = {}
              for wrapped in listed.get("dashboards", []):
                  dashboard = next((value for value in wrapped.values() if value), None)
                  if dashboard:
                      existing.setdefault(dashboard["title"], []).append(dashboard["dashboardId"])

              for dashboard_path in sorted(Path("/dashboards").glob("*.json")):
                  dashboard = json.loads(dashboard_path.read_text())
                  matches = existing.get(dashboard["title"], [])
                  if matches:
                      dashboard_id = matches[0]
                      dashboard["dashboardId"] = dashboard_id
                      send(
                          "PUT",
                          f"/api/{quote(organization)}/dashboards/{quote(dashboard_id)}?folder={quote(folder)}",
                          dashboard,
                      )
                      print(f"Updated dashboard {dashboard['title']} ({dashboard_id})")
                  else:
                      send("POST", f"/api/{quote(organization)}/dashboards?folder={quote(folder)}", dashboard)
                      print(f"Imported dashboard {dashboard['title']}")
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: ZO_ORGANIZATION
              value: {{ .Values.dashboards.organization | quote }}
            - name: ZO_DASHBOARD_FOLDER
              value: {{ .Values.dashboards.folder | quote }}
            - name: ZO_ROOT_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.managedSecretName }}
                  key: ZO_ROOT_USER_EMAIL
            - name: ZO_ROOT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.managedSecretName }}
                  key: ZO_ROOT_USER_PASSWORD
          resources:
{{ toYaml .Values.dashboards.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: dashboards
              mountPath: /dashboards
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: dashboards
          configMap:
            name: {{ .Release.Name }}-dashboards
        - name: temporary
          emptyDir: {}
{{- end }}
