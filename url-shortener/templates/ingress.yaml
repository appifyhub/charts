{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- if .Values.ingress.rateLimit.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-redirect-rate-limit@kubernetescrd" .Release.Namespace .Release.Name | quote }}
    {{- end }}

spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.domain.prefix }}.{{ .Values.ingress.domain.base }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-service
                port:
                  number: {{ .Values.app.servicePort }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.domain.prefix }}.{{ .Values.ingress.domain.base }}
  {{- end }}
{{- end }}
{{- if .Values.ingress.apiAllowList.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ .Release.Name }}-api-ingress
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-api-allow-list@kubernetescrd" .Release.Namespace .Release.Name | quote }}

spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.domain.prefix }}.{{ .Values.ingress.domain.base }}
      http:
        paths:
          - path: /rest
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-service
                port:
                  number: {{ .Values.app.servicePort }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.domain.prefix }}.{{ .Values.ingress.domain.base }}
  {{- end }}
{{- end }}
