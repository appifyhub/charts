{{- if and .Values.ingress.enabled .Values.ingress.rateLimit.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: {{ .Release.Name }}-redirect-rate-limit

spec:
  rateLimit:
    average: {{ default 20 .Values.ingress.rateLimit.average }}
    period: {{ default "1m" .Values.ingress.rateLimit.period | quote }}
    burst: {{ default 5 .Values.ingress.rateLimit.burst }}
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: {{ default 64 .Values.ingress.rateLimit.ipv6Subnet }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.apiAllowList.enabled }}
{{- if not .Values.ingress.apiAllowList.sourceRange }}
{{- fail "ingress.apiAllowList.sourceRange must not be empty when the API allow-list is enabled" }}
{{- end }}
{{- if .Values.ingress.rateLimit.enabled }}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware

metadata:
  name: {{ .Release.Name }}-api-allow-list

spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.ingress.apiAllowList.sourceRange | nindent 6 }}
{{- end }}
